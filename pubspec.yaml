name: shelfsense
description: "Offline shelf audit and ordering for kirana distributor reps."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.1
  connectivity_plus: ^7.3.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  geolocator: ^14.0.3
  go_router: ^17.5.0
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.9.2
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  permission_handler: ^13.0.2
  printing: ^5.15.0
  share_plus: ^13.3.0
  shelf: ^1.4.2
  syncfusion_flutter_xlsio: ^34.2.7
  tflite_flutter: ^0.12.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/seed/
    - assets/models/
    - assets/benchmark/
    - assets/benchmark/eval_set/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
