org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Several Flutter plugins (tflite_flutter, google_mlkit_commons) declare Java 11 while their
# Kotlin tasks target 17. Downgrade the Kotlin plugin's mismatch check to a warning.
kotlin.jvm.target.validation.mode=warning
# The out-of-process Kotlin daemon kept stale incremental-cache registrations between builds
# ("Storage ... is already registered") and failed compileReleaseKotlin. Compile in-process.
kotlin.compiler.execution.strategy=in-process
# Kotlin 2.3's incremental compiler fails on a fresh build dir on this machine
# ("Storage ... is already registered"); non-incremental compilation is fine for our build sizes.
kotlin.incremental=false
